name: Fetch RSS Feeds

on:
  schedule:
    # 毎日 0:00 UTC (9:00 JST) に実行
    - cron: '0 0 * * *'
  workflow_dispatch:
    # 手動実行も可能

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch RSS feeds
        run: node scripts/fetch_rss.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/items.json
          git diff --staged --quiet && echo "No changes." || (
            git commit -m "chore: update news data $(date -u '+%Y-%m-%d') [skip ci]" &&
            git push
          )
